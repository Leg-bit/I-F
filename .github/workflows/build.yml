name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub-hosted Ubuntu runners already include the Android command-line
      # tools. Install only valid SDK package IDs; the legacy package "tools"
      # is no longer available and causes sdkmanager to exit with code 1.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android SDK command-line tools were not found on the runner."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Unzip project (newest zip only)
        shell: bash
        run: |
          set -euo pipefail
          newest="$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$newest" ]; then
            echo "No .zip in repo root, using files as they are."
          else
            echo "Unzipping $newest"
            unzip -oq "$newest"
          fi

      - name: Locate project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          settings="$(find . -name settings.gradle.kts -not -path './.git/*' | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi
          dir="$(dirname "$settings")"
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle :android:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          echo "===== Kotlin / Gradle errors ====="
          grep -E "^e: |error:|What went wrong|Execution failed|Could not" -A4 build.log | head -150 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.locate.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-debug-apk
          path: ${{ steps.locate.outputs.dir }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
