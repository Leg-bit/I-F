name: Android CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK (already installed on the runner)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$ANDROID_HOME/build-tools"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Unzip project if it is a zip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No .zip in repo root, using the files as they are."
          else
            for z in "${zips[@]}"; do
              echo "Unzipping $z"
              unzip -oq "$z"
            done
          fi

      - name: Locate project
        id: locate
        run: |
          found=$(find . -name settings.gradle.kts -not -path './.git/*' | awk '{ print length, $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$found" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi
          dir=$(dirname "$found")
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle :android:assembleDebug --stacktrace --no-daemon

      - name: Name the APK and show its signing key
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/build.gradle.kts | head -n1)
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -n1)
          mv "$APK" "android/build/outputs/apk/debug/IRON-FRONT-v${VERSION}.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "The SHA-256 below must be the SAME on every build, so the app can be updated without uninstalling:"
          "$SDK/build-tools/34.0.0/apksigner" verify --print-certs "android/build/outputs/apk/debug/IRON-FRONT-v${VERSION}.apk" | head -n 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-debug-apk
          path: ${{ steps.locate.outputs.dir }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
